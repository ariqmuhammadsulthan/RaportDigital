[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "raportdigital"
version = "1.1.0"
description = "Standalone Indonesian gradebook starter with a Flask reference backend"
readme = "README.md"
license-files = ["LICENSE", "docs/origins.md"]
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1.3,<3.2",
  "cryptography>=46,<50",
  "waitress>=3.0.2,<4",
]

[project.scripts]
raportdigital = "raportdigital.cli:cli"

[tool.setuptools.packages.find]
include = ["raportdigital*"]

[tool.setuptools.package-data]
raportdigital = ["schema.sql", "static/*.js", "static/*.css", "templates/*.html"]
